# nginx for the containerized frontend. Serves the built SPA, and (when a
# "backend" service exists on the compose network -- docker-compose.triton.yml,
# not docker-compose.yml, which points VITE_API_BASE_URL at a deployed Modal
# backend instead and never hits these routes) reverse-proxies the API to it
# so the browser only ever talks to one origin (no hardcoded host IP, no CORS).
server {
    listen 80;
    server_name _;

    # /detect uploads a full image; allow generous bodies.
    client_max_body_size 50m;

    # Static SPA (React/Vite build -> /usr/share/nginx/html).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Docker's embedded DNS -- resolves "backend" lazily, at request time,
    # instead of nginx's default of resolving proxy_pass hostnames once at
    # config load. Without this, nginx refuses to start at all ("host not
    # found in upstream") on docker-compose.yml, which has no "backend"
    # service. Requests to these routes 502 there instead (harmless: the
    # frontend never calls them when VITE_API_BASE_URL is set to an absolute
    # URL, which docker-compose.yml always does).
    resolver 127.0.0.11 valid=30s;

    # API proxy. A dense image fans out into many sequential Triton tile calls
    # and a single /detect can take minutes, so raise the read timeout well
    # above nginx's 60s default (triton_engine itself allows 300s per tile).
    location /detect {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # OpenAPI UI + schema, for convenience.
    location /docs {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_read_timeout 600s;
    }
    location /openapi.json {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
    }
}
