# nginx for the containerized frontend. Serves the built SPA and reverse-
# proxies the API to the backend service so the browser only ever talks to one
# origin (no hardcoded host IP, no CORS). Used by both docker-compose.yml
# (local CPU backend) and docker-compose.triton.yml (Triton backend).
server {
    listen 80;
    server_name _;

    # /detect uploads a full image; allow generous bodies.
    client_max_body_size 50m;

    # Static SPA (React/Vite build -> /usr/share/nginx/html).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # API proxy. A dense image fans out into many sequential Triton tile calls
    # and a single /detect can take minutes, so raise the read timeout well
    # above nginx's 60s default (triton_engine itself allows 300s per tile).
    location /detect {
        proxy_pass http://backend:8000;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # OpenAPI UI + schema, for convenience.
    location /docs {
        proxy_pass http://backend:8000;
        proxy_read_timeout 600s;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
    }
}
