services:
  # Frontend only -- backend + inference both run on Modal now (see
  # DEPLOYMENT.md's "Deploying modal_app/backend_server.py" /
  # "Deploying modal_app/model_server.py"), so there's no local backend
  # container left to run. VITE_API_BASE_URL below points the built SPA at
  # the deployed backend's Modal URL directly (absolute, cross-origin --
  # backend/app.py already has CORS wide open). The self-hosted full-stack
  # option (local CPU or Triton backend, own frontend) still exists as
  # docker-compose.triton.yml.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Both are baked in at build time (Vite env vars aren't readable at
        # container runtime) -- rebuild (`docker compose up --build`) for a
        # change to either to take effect. See .env.example.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://terenceylchow--locate-anything-backend-fastapi-app.modal.run}
        VITE_DEFAULT_SCENE_ID: ${VITE_DEFAULT_SCENE_ID:-}
    ports:
      - "5173:80"
    volumes:
      # Mounted as a DIRECTORY, not individual files -- a single-file bind
      # mount breaks as soon as the file is saved via write-new-file-then-
      # rename (what most editors/tools do): the mount tracks the original
      # inode, which the rename orphans, so edits stop appearing in the
      # container even though the file looks right on the host. Mounting the
      # containing directory avoids that (see frontend/src/scenes.ts's
      # comment for the full explanation). This one mount covers both
      # scenes.json and images/ (frontend/public/scene-config/images/) since
      # both live under scene-config/ -- add a scene: edit scenes.json + drop
      # an image in images/, then just refresh the browser, no rebuild.
      - ./frontend/public/scene-config:/usr/share/nginx/html/scene-config:ro
